<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大盘宏观数据看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;padding:15px}
h1{text-align:center;font-size:18px;margin:6px 0 4px}
.bar{text-align:center;font-size:12px;color:#888;margin-bottom:15px}
.bar b{color:#e53935}
button{border:1px solid #f5a623;background:#fff;color:#c07a00;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;margin-left:6px}
button:active{background:#fff3d6}

/* 核心布局：三栏自适应网格 */
.wrap{display:grid;grid-template-columns:repeat(3, 1fr);gap:15px}

.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h3{background:#f5a623;color:#fff;text-align:center;padding:9px 6px;font-size:14px;letter-spacing:1px}

/* ===== 柱状图 ===== */
.chart-box{padding:16px 10px 8px;border-bottom:1px solid #eee}
.chart-title{text-align:center;font-size:13px;color:#666;margin-bottom:10px;font-weight:600}
.chart-bars{display:flex;align-items:stretch;height:400px;gap:3px;position:relative}
.chart-bar{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0;cursor:pointer;position:relative}
.chart-bar:hover{opacity:.85}
.chart-bar .bar-val{height:22px;display:flex;align-items:flex-end;justify-content:center;font-size:12px;color:#333;font-weight:600;white-space:nowrap}
.chart-bar .bar-area{flex:1;display:flex;align-items:flex-end;justify-content:center;position:relative}
.chart-bar .bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:1px}
.chart-bar .bar-date{height:26px;display:flex;align-items:flex-start;justify-content:center;font-size:12px;color:#333;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chart-ylabels{position:absolute;left:0;top:0;bottom:26px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:#999;pointer-events:none;z-index:10}
.chart-ylabels span{transform:translateX(-6px)}

/* 表格部分 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fff8e1;padding:7px 3px;text-align:center;font-weight:600;border-bottom:2px solid #f5a623;white-space:nowrap}
td{padding:6px 3px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap}
tr:nth-child(even){background:#fafafa}
.up{color:#e53935;font-weight:600}
.down{color:#2e7d32;font-weight:600}
.dash{color:#bbb}
.tip{text-align:center;font-size:11px;color:#aaa;margin-top:12px;padding:6px}
.err{color:#e53935}
.loading{color:#999}

@media(max-width:1200px){ .wrap{grid-template-columns:1fr 1fr;} }
@media(max-width:800px){ 
  .wrap{grid-template-columns:1fr}
  .chart-bars{height:300px}
  .chart-bar .bar-val{font-size:10px;height:18px}
  .chart-bar .bar-date{font-size:10px;height:22px}
}
</style>
</head>
<body>

<h1>沪深两市成交额 & 融资余额 & 北向资金</h1>
<div class="bar">数据更新时间：<b id="ts">--</b> <button onclick="loadAll()">刷新</button></div>

<div class="wrap">
  <!-- 模块1：两市成交额 -->
  <div class="card">
    <h3>两市成交额（亿元）</h3>
    <div class="chart-box">
      <div class="chart-title">近15日成交额趋势</div>
      <div class="chart-bars" id="chartV"><div class="chart-ylabels" id="yV"></div></div>
    </div>
    <table><thead><tr><th>日期</th><th>沪市</th><th>深市</th><th>合计</th><th>环比增减</th></tr></thead>
    <tbody id="tbV"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody></table>
  </div>

  <!-- 模块2：两市融资余额 -->
  <div class="card">
    <h3>两市融资余额（亿元）</h3>
    <div class="chart-box">
      <div class="chart-title">近15日融资余额趋势</div>
      <div class="chart-bars" id="chartM"><div class="chart-ylabels" id="yM"></div></div>
    </div>
    <table><thead><tr><th>日期</th><th>融资余额</th><th>环比增减</th></tr></thead>
    <tbody id="tbM"><tr><td colspan="3" class="loading">加载中…</td></tr></tbody></table>
  </div>

  <!-- 模块3：北向资金（新增） -->
  <div class="card">
    <h3>北向资金净流入（亿元）</h3>
    <div class="chart-box">
      <div class="chart-title">近15日北向资金趋势</div>
      <div class="chart-bars" id="chartN"><div class="chart-ylabels" id="yN"></div></div>
    </div>
    <table><thead><tr><th>日期</th><th>净流入</th><th>环比增减</th></tr></thead>
    <tbody id="tbN"><tr><td colspan="3" class="loading">加载中…</td></tr></tbody></table>
  </div>
</div>

<div class="tip" id="tip">单位：亿元｜北向资金为陆股通净买入｜红涨绿跌（流入为红）</div>

<script>
var yi = 100000000;
var COLOR_UP = '#e53935';    // 涨/流入 -> 红
var COLOR_DOWN = '#2e7d32';  // 跌/流出 -> 绿
var COLOR_FLAT = '#9e9e9e';  // 平 -> 灰

/* 全局缓存：防止自动刷新失败时页面数据清空 */
var CACHE_VOLUME = null;
var CACHE_MARGIN = null;
var CACHE_NORTH = null;

/* JSONP 请求核心 */
function jsonp(url, cbName, timeout){
  cbName = cbName || 'cb'; timeout = timeout || 12000;
  return new Promise(function(resolve, reject){
    var name = '__c' + Date.now() + Math.floor(Math.random()*1e5);
    var s = document.createElement('script');
    var t = setTimeout(function(){ done(); reject(new Error('timeout')); }, timeout);
    function done(){ clearTimeout(t); try{delete window[name];}catch(e){window[name]=undefined;} s.remove(); }
    window[name] = function(d){ done(); resolve(d); };
    s.onerror = function(){ done(); reject(new Error('load fail')); };
    s.src = url + (url.indexOf('?')>-1?'&':'?') + cbName + '=' + name;
    document.head.appendChild(s);
  });
}

/* 失败重试机制（过滤偶发抖动） */
async function jsonpRetry(url, cbName, retries){
  retries = retries || 2;
  for(var i=0; i<retries; i++){
    try{ return await jsonp(url, cbName); }catch(e){ if(i === retries-1) throw e; }
    await new Promise(r => setTimeout(r, 1500));
  }
}

/* 辅助函数 */
function fmt(n){ return (n==null||isNaN(n))?'—':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function diff(cur, prev){
  if(cur==null||prev==null) return {t:'—',c:'dash'};
  var d = cur - prev;
  return {t:(d>0?'+':'')+d.toLocaleString('zh-CN',{maximumFractionDigits:2}), c:d>0?'up':(d<0?'down':'dash')};
}
function barColor(cur, prev){
  if(cur==null||prev==null) return COLOR_FLAT;
  var d = cur - prev;
  return d>0 ? COLOR_UP : (d<0 ? COLOR_DOWN : COLOR_FLAT);
}

// ---------------- 获取数据接口 ----------------

// 1. 实时成交额
async function loadRealtimeVolume(){
  var url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.000001,0.399106&fields=f6,f12,f14';
  var d = await jsonpRetry(url, 'cb');
  var arr = (d && d.data && d.data.diff) || [];
  var sh=null, sz=null;
  for(var i=0;i<arr.length;i++){
    if(arr[i].f12==='000001') sh=arr[i].f6;
    if(arr[i].f12==='399106') sz=arr[i].f6;
  }
  return { sh:sh==null?null:sh/yi, sz:sz==null?null:sz/yi };
}

// 2. 成交额历史
async function loadVolumeHistory(secid){
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid
          + '&fields1=f1,f2,f3&fields2=f51,f57&klt=101&fqt=1&end=20500101&lmt=25';
  var d = await jsonpRetry(url, 'cb');
  var k = (d && d.data && d.data.klines) || [];
  var out=[];
  for(var i=0;i<k.length;i++){ var p=String(k[i]).split(','); out.push({date:p[0], amt:parseFloat(p[1])/yi}); }
  return out;
}

// 3. 融资余额
var MARGIN_URL = 'https://datacenter-web.eastmoney.com/api/data/v1/get'
  + '?reportName=RPTA_RZRQ_LSHJ&columns=DIM_DATE,RZYE&source=WEB'
  + '&sortColumns=DIM_DATE&sortTypes=-1&pageSize=25&pageNumber=1';

function parseMargin(d){
  var rows = (d && d.result && d.result.data) || [];
  var out = [];
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var date = r.DIM_DATE || r.dim_date || '';
    var v = (r.RZYE!=null)?r.RZYE:(r.rzye!=null?r.rzye:null);
    if(date && v!=null) out.push({date:String(date).slice(0,10), val:parseFloat(v)/yi});
  }
  return out;
}

async function loadMargin(){
  try{
    var res = await fetch(MARGIN_URL, {cache:'no-cache'});
    var d = await res.json();
    var out = parseMargin(d);
    if(out.length) return out;
  }catch(e){}
  try{
    var d2 = await jsonpRetry(MARGIN_URL, 'callback');
    var out2 = parseMargin(d2);
    if(out2.length) return out2;
  }catch(e){}
  throw new Error('融资余额获取失败');
}

// 4. 北向资金 (陆股通净买入)
var NORTH_URL = 'https://datacenter-web.eastmoney.com/api/data/v1/get'
  + '?reportName=RPT_MUTUAL_DEAL_HISTORY&columns=TRADE_DATE,NET_DEAL_AMT&source=WEB'
  + '&sortColumns=TRADE_DATE&sortTypes=-1&pageSize=25&pageNumber=1';

function parseNorth(d){
  var rows = (d && d.result && d.result.data) || [];
  var out = [];
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var date = r.TRADE_DATE || r.trade_date || '';
    var v = (r.NET_DEAL_AMT!=null)?r.NET_DEAL_AMT:(r.net_deal_amt!=null?r.net_deal_amt:null);
    if(date && v!=null) out.push({date:String(date).slice(0,10), val:parseFloat(v)/yi});
  }
  return out;
}

async function loadNorth(){
  try{
    var res = await fetch(NORTH_URL, {cache:'no-cache'});
    var d = await res.json();
    var out = parseNorth(d);
    if(out.length) return out;
  }catch(e){}
  try{
    var d2 = await jsonpRetry(NORTH_URL, 'callback');
    var out2 = parseNorth(d2);
    if(out2.length) return out2;
  }catch(e){}
  throw new Error('北向资金获取失败');
}

// ---------------- 渲染逻辑 ----------------

function drawChart(containerId, yId, rows, key, isNorth){
  var container = document.getElementById(containerId);
  var yLabels = document.getElementById(yId);
  var take = rows.slice(-15);
  if(!take.length){ yLabels.innerHTML=''; return; }

  var vals = take.map(function(r){ return r[key]; });
  var max = 0, min = 0;
  for(var i=0;i<vals.length;i++){ 
    if(vals[i]!=null && vals[i]>max) max=vals[i]; 
    if(vals[i]!=null && vals[i]<min) min=vals[i];
  }
  
  // 确定Y轴范围 (正负对称显示，更适合北向资金)
  var absMax = Math.max(Math.abs(max), Math.abs(min));
  if(absMax === 0) absMax = 100; // 默认最小刻度
  var roundTo = (key === 'total') ? 5000 : (isNorth ? 20 : 500);
  absMax = Math.ceil(absMax / roundTo) * roundTo;

  // Y轴刻度
  var yHtml = '';
  var steps = [absMax, Math.round(absMax*0.5), 0, Math.round(-absMax*0.5), -absMax];
  for(var i=0;i<steps.length;i++) yHtml += '<span>'+fmt(steps[i])+'</span>';
  yLabels.innerHTML = yHtml;

  var html = '';
  for(var i=0;i<take.length;i++){
    var r = take[i];
    // 计算柱子高度百分比 (基于 -absMax 到 absMax 的绝对范围)
    var pct = (r[key]!=null && absMax>0) ? ((r[key] + absMax) / (2 * absMax) * 100) : 50;
    var color = r[key]>=0 ? COLOR_UP : COLOR_DOWN;
    var tipText = r.date + '：' + fmt(r[key]) + '亿';

    html += '<div class="chart-bar" title="'+tipText+'">';
    html += '  <div class="bar-val">'+(r[key]!=null?fmt(r[key]):'—')+'</div>';
    html += '  <div class="bar-area">';
    html += '    <div class="bar-fill" style="height:'+pct+'%;background:'+color+';bottom:'+ (r[key]<0 ? pct : '50%') + '"></div>';
    html += '  </div>';
    html += '  <div class="bar-date">'+r.date.slice(5)+'</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function renderVolume(shH, szH, today){
  var n=Math.max(shH.length, szH.length), rows=[];
  for(var i=0;i<n;i++){
    var sh=shH[i]?shH[i].amt:null, sz=szH[i]?szH[i].amt:null;
    var date=(shH[i]&&shH[i].date)||(szH[i]&&szH[i].date)||'';
    rows.push({date:date, sh:sh, sz:sz, total:(sh!=null&&sz!=null)?sh+sz:null});
  }
  if(today && (today.sh!=null||today.sz!=null)){
    var t={date:today.date, sh:today.sh, sz:today.sz, total:(today.sh!=null&&today.sz!=null)?today.sh+today.sz:null};
    var last=rows[rows.length-1];
    if(last && last.date===t.date) rows[rows.length-1]=t; else rows.push(t);
  }
  
  CACHE_VOLUME = rows;
  drawChart('chartV', 'yV', rows, 'total', false);
  rows.reverse();
  var h='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i], prev=(i+1<rows.length)?rows[i+1].total:null, df=diff(r.total, prev);
    h+='<tr><td>'+r.date+'</td><td>'+fmt(r.sh)+'</td><td>'+fmt(r.sz)+'</td>'
      +'<td><strong>'+fmt(r.total)+'</strong></td><td class="'+df.c+'">'+df.t+'</td></tr>';
  }
  document.getElementById('tbV').innerHTML = h || '<tr><td colspan="5" class="err">暂无数据</td></tr>';
}

function renderMargin(list){
  if(!list || !list.length) return;
  var rows = list.slice().reverse();
  CACHE_MARGIN = rows;
  drawChart('chartM', 'yM', rows, 'val', false);
  rows.reverse();
  var h='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i], prev=(i+1<rows.length)?rows[i+1].val:null, df=diff(r.val, prev);
    h+='<tr><td>'+r.date+'</td><td><strong>'+fmt(r.val)+'</strong></td>'
      +'<td class="'+df.c+'">'+df.t+'</td></tr>';
  }
  document.getElementById('tbM').innerHTML=h;
}

function renderNorth(list){
  if(!list || !list.length) return;
  var rows = list.slice().reverse();
  CACHE_NORTH = rows;
  drawChart('chartN', 'yN', rows, 'val', true);
  rows.reverse();
  var h='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i], prev=(i+1<rows.length)?rows[i+1].val:null, df=diff(r.val, prev);
    h+='<tr><td>'+r.date+'</td><td class="'+(r.val>=0?'up':'down')+'"><strong>'+fmt(r.val)+'</strong></td>'
      +'<td class="'+df.c+'">'+df.t+'</td></tr>';
  }
  document.getElementById('tbN').innerHTML=h;
}

/* 渲染缓存（当获取失败时调用，绝不黑屏） */
function renderCache(){
  if(CACHE_VOLUME) {
    var rows = CACHE_VOLUME.slice();
    drawChart('chartV', 'yV', rows, 'total', false);
    rows.reverse();
    var h='';
    for(var i=0;i<rows.length;i++){
      var r=rows[i], prev=(i+1<rows.length)?rows[i+1].total:null, df=diff(r.total, prev);
      h+='<tr><td>'+r.date+'</td><td>'+fmt(r.sh)+'</td><td>'+fmt(r.sz)+'</td>'
        +'<td><strong>'+fmt(r.total)+'</strong></td><td class="'+df.c+'">'+df.t+'</td></tr>';
    }
    document.getElementById('tbV').innerHTML = h;
  }
  if(CACHE_MARGIN) {
    var mRows = CACHE_MARGIN.slice();
    drawChart('chartM', 'yM', mRows, 'val', false);
    mRows.reverse();
    var h='';
    for(var i=0;i<mRows.length;i++){
      var r=mRows[i], prev=(i+1<mRows.length)?mRows[i+1].val:null, df=diff(r.val, prev);
      h+='<tr><td>'+r.date+'</td><td><strong>'+fmt(r.val)+'</strong></td>'
        +'<td class="'+df.c+'">'+df.t+'</td></tr>';
    }
    document.getElementById('tbM').innerHTML=h;
  }
  if(CACHE_NORTH) {
    var nRows = CACHE_NORTH.slice();
    drawChart('chartN', 'yN', nRows, 'val', true);
    nRows.reverse();
    var h='';
    for(var i=0;i<nRows.length;i++){
      var r=nRows[i], prev=(i+1<nRows.length)?nRows[i+1].val:null, df=diff(r.val, prev);
      h+='<tr><td>'+r.date+'</td><td class="'+(r.val>=0?'up':'down')+'"><strong>'+fmt(r.val)+'</strong></td>'
        +'<td class="'+df.c+'">'+df.t+'</td></tr>';
    }
    document.getElementById('tbN').innerHTML=h;
  }
}

// 主加载函数
async function loadAll(){
  var tip=document.getElementById('tip'), errs=[];
  
  // 1. 加载成交额
  try{
    var shH=await loadVolumeHistory('1.000001');
    var szH=await loadVolumeHistory('0.399106');
    var today=null;
    try{ var q=await loadRealtimeVolume(); today={date:new Date().toISOString().slice(0,10), sh:q.sh, sz:q.sz}; }catch(e){}
    renderVolume(shH, szH, today);
  }catch(e){ errs.push('成交额'); renderCache(); }
  
  // 2. 加载融资余额
  try{ renderMargin(await loadMargin()); }
  catch(e){ errs.push('融资'); renderCache(); }

  // 3. 加载北向资金
  try{ renderNorth(await loadNorth()); }
  catch(e){ errs.push('北向'); renderCache(); }
  
  document.getElementById('ts').textContent = new Date().toLocaleString('zh-CN');
  if(errs.length){
    tip.textContent = '提示：'+errs.join('、')+' 接口波动，已自动保留上次成功数据。';
    tip.style.color = '#e53935';
  } else {
    tip.textContent = '单位：亿元｜北向资金为陆股通净买入｜红涨绿跌（流入为红）';
    tip.style.color = '#aaa';
  }
}

// 启动及自动刷新
loadAll();
setInterval(loadAll, 180000); // 3分钟自动刷新
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadAll(); });
</script>
</body>
</html>
